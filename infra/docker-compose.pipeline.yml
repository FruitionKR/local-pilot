services:
  pipeline-api:
    build:
      context: ../services/ai/pipeline
    container_name: fruition-pipeline-api-dev
    restart: unless-stopped
    environment:
      # 전환기: pipeline은 core_db에 ai_runtime 계정으로 접속한다 (ai_db 분리 완료 전까지)
      DATABASE_URL: postgresql://${AI_DB_RUNTIME_USER:-ai_runtime}:${AI_DB_RUNTIME_PASSWORD:-ai_runtime_dev_password}@postgresql:5432/${CORE_DB_NAME:-core_db}
      # ai_db 1단계 분리: wiki_schemas·document_derived_state는 ai_db에 둔다
      AI_DATABASE_URL: postgresql://${AI_DB_RUNTIME_USER:-ai_runtime}:${AI_DB_RUNTIME_PASSWORD:-ai_runtime_dev_password}@postgresql:5432/${AI_DB_NAME:-ai_db}
      ACCESS_INTERNAL_BASE_URL: ${ACCESS_INTERNAL_BASE_URL:-http://host.docker.internal:8081}
      # ai_db 스키마 적용(멱등)은 pipeline-api 기동 시에만 수행한다
      AI_DB_MIGRATION_URL: postgresql://${AI_DB_MIGRATION_USER:-ai_migration}:${AI_DB_MIGRATION_PASSWORD:-ai_migration_dev_password}@postgresql:5432/${AI_DB_NAME:-ai_db}
      LLM_PROVIDER: ${LLM_PROVIDER:-upstage}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-local-pilot-dev}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      QUERY_EMBEDDING_MODE: ${QUERY_EMBEDDING_MODE:-text-only}
      QUERY_EVALUATOR_MODE: ${QUERY_EVALUATOR_MODE:-disabled}
      QUERY_EVALUATOR_MAX_ATTEMPTS: ${QUERY_EVALUATOR_MAX_ATTEMPTS:-2}
      QUERY_WEB_SEARCH_MODE: ${QUERY_WEB_SEARCH_MODE:-disabled}
      QUERY_WEB_SEARCH_MAX_RESULTS: ${QUERY_WEB_SEARCH_MAX_RESULTS:-5}
      QUERY_WEB_SEARCH_TIMEOUT_SECONDS: ${QUERY_WEB_SEARCH_TIMEOUT_SECONDS:-10}
      QUERY_MIN_INTERNAL_RELEVANCE_SCORE: ${QUERY_MIN_INTERNAL_RELEVANCE_SCORE:-0.0}
      AGENT_SKILLS_ENABLED: ${AGENT_SKILLS_ENABLED:-false}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-local-agent-internal}
      INTERNAL_CALLBACK_TOKEN: ${INTERNAL_CALLBACK_TOKEN:-local-internal-callback}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-fruition-storage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fruition}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fruition_dev_secret}
    ports:
      - "127.0.0.1:${PIPELINE_API_PORT:-8000}:8000"
    volumes:
      - pipeline-runs:/app/runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
  ingest-worker:
    build:
      context: ../services/ai/pipeline
    container_name: fruition-ingest-worker-dev
    restart: unless-stopped
    command: ["python", "-m", "app.workers.ingest_worker"]
    environment:
      # 전환기: pipeline은 core_db에 ai_runtime 계정으로 접속한다 (ai_db 분리 완료 전까지)
      DATABASE_URL: postgresql://${AI_DB_RUNTIME_USER:-ai_runtime}:${AI_DB_RUNTIME_PASSWORD:-ai_runtime_dev_password}@postgresql:5432/${CORE_DB_NAME:-core_db}
      # ai_db 1단계 분리: wiki_schemas·document_derived_state는 ai_db에 둔다
      AI_DATABASE_URL: postgresql://${AI_DB_RUNTIME_USER:-ai_runtime}:${AI_DB_RUNTIME_PASSWORD:-ai_runtime_dev_password}@postgresql:5432/${AI_DB_NAME:-ai_db}
      ACCESS_INTERNAL_BASE_URL: ${ACCESS_INTERNAL_BASE_URL:-http://host.docker.internal:8081}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INGEST_COMMAND_TOPIC: ${INGEST_COMMAND_TOPIC:-ai.ingest.command}
      LLM_PROVIDER: ${LLM_PROVIDER:-upstage}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-local-pilot-dev}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      INTERNAL_CALLBACK_TOKEN: ${INTERNAL_CALLBACK_TOKEN:-local-internal-callback}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-fruition-storage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fruition}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fruition_dev_secret}
    volumes:
      - pipeline-runs:/app/runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  edit-event-consumer:
    build:
      context: ../services/ai/pipeline
    container_name: fruition-edit-event-consumer-dev
    restart: unless-stopped
    command: ["python", "-m", "app.workers.edit_event_consumer"]
    environment:
      # document.edit.event → ai_db document_derived_state 추적 (core_db 접속 없음)
      AI_DATABASE_URL: postgresql://${AI_DB_RUNTIME_USER:-ai_runtime}:${AI_DB_RUNTIME_PASSWORD:-ai_runtime_dev_password}@postgresql:5432/${AI_DB_NAME:-ai_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DOCUMENT_EDIT_EVENT_TOPIC: ${DOCUMENT_EDIT_EVENT_TOPIC:-document.edit.event}
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  pipeline-agent-worker:
    build:
      context: ../services/ai/pipeline
    container_name: fruition-pipeline-agent-worker-dev
    restart: unless-stopped
    profiles: ["agent-skills"]
    command: ["python", "agent_worker.py"]
    environment:
      # 전환기: pipeline은 core_db에 ai_runtime 계정으로 접속한다 (ai_db 분리 완료 전까지)
      DATABASE_URL: postgresql://${AI_DB_RUNTIME_USER:-ai_runtime}:${AI_DB_RUNTIME_PASSWORD:-ai_runtime_dev_password}@postgresql:5432/${CORE_DB_NAME:-core_db}
      # ai_db 1단계 분리: wiki_schemas·document_derived_state는 ai_db에 둔다
      AI_DATABASE_URL: postgresql://${AI_DB_RUNTIME_USER:-ai_runtime}:${AI_DB_RUNTIME_PASSWORD:-ai_runtime_dev_password}@postgresql:5432/${AI_DB_NAME:-ai_db}
      LLM_PROVIDER: ${LLM_PROVIDER:-upstage}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AGENT_BACKEND_URL: http://host.docker.internal:8080
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-local-agent-internal}
      AGENT_SKILLS_ENABLED: ${AGENT_SKILLS_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(b'agent_worker.py' not in pathlib.Path('/proc/1/cmdline').read_bytes())"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pipeline-runs:
