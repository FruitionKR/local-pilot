# 로컬 지표 확인용 선택 스택. 백엔드 actuator(관리 포트)를 Prometheus가 긁고 Grafana가 그린다.
# 업무 기능과 무관하므로 dev-up.sh는 이 스택을 띄우지 않는다 — 필요할 때만 올린다.
#   docker compose -f infra/compose.monitoring.yml up -d
name: fruition-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: fruition-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 로컬 개발용이라 보존 기간을 짧게 둔다. 디스크가 무한히 늘지 않는다.
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # 스크레이프 대상이 호스트에서 도는 bootRun 프로세스다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana-oss:12.0.0
    container_name: fruition-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # 로컬 전용. 포트를 127.0.0.1에만 바인딩하므로 외부에서 닿지 않는다.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    # 프론트엔드가 3000을 쓰므로 3001로 낸다.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # 저장소에 커밋한 대시보드. provisioning/dashboards/fruition.yml이 이 경로를 읽는다.
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  prometheus-data:
  grafana-data:
