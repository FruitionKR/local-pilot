name: fruition-mvp-dev

services:
  postgresql:
    image: postgres:16-alpine
    container_name: fruition-postgresql-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fruition_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-fruition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fruition_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: fruition-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fruition}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fruition_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: fruition-minio-init-dev
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fruition}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fruition_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-fruition-storage}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
        sleep 1;
      done &&
      mc mb --ignore-existing "local/$${S3_BUCKET}" &&
      mc anonymous set none "local/$${S3_BUCKET}"
    restart: "no"

volumes:
  postgresql-data:
  minio-data:
