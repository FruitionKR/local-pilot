      tags:
      - internal-authz-controller
  /internal/users/{user_id}:
    get:
      operationId: user
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
      - in: header
        name: X-Internal-Token
        required: false
        schema:
          type: string
      responses:
        "200":
