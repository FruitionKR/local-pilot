            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - internal-authz-controller
  /internal/workspaces/{workspace_id}/ai-model-settings:
    get:
      operationId: get
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: header
        name: X-Internal-Token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - internal-workspace-ai-model-controller
    put:
      operationId: update
      parameters:
      - example: ws_9d47a0e9a6324341b47562553b75f92a
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
          default: ws_9d47a0e9a6324341b47562553b75f92a
      - in: header
        name: X-Internal-Token
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAiModelRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - internal-workspace-ai-model-controller
components:
  schemas:
    AiModelSelectionRequest:
      type: object
      description: 설정할 provider와 model 조합. 활성 catalog에 있는 짝만 허용된다.
      properties:
        model:
          type: string
          description: provider와 짝이 맞는 모델명
          example: gpt-5-nano
          minLength: 1
        provider:
          type: string
          description: LLM provider. 활성 model catalog에 있는 조합만 허용된다.
          enum:
          - openai
          - gemini
          - claude
          example: openai
          minLength: 1
      required:
      - model
      - provider
    DisplayNameUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          description: 새 표시 이름(255자 이하)
          example: 새 이름
          maxLength: 255
          minLength: 0
      required:
      - display_name
    EmailAvailabilityRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 가입 가능 여부를 확인할 이메일
          example: user@example.com
          minLength: 1
      required:
      - email
    EmailAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
          description: 이메일로 신규 가입할 수 있으면 true
          example: true
    EmailChangeRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
          description: 바꿀 새 이메일. 이 주소로 받은 인증번호의 토큰이어야 한다.
          example: new@example.com
          maxLength: 255
          minLength: 0
        verification_token:
          type: string
          description: purpose=email_change로 받은 1회용 토큰
          example: EXAMPLE-verification-token-not-real-0000000
          minLength: 1
      required:
      - new_email
      - verification_token
    EmailVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 인증번호를 받을 이메일
          example: user@example.com
          minLength: 1
        purpose:
          type: string
          description: "인증 목적. signup은 이미 가입된 이메일이면 409로 거절된다. email_change는 바꾸려는 새 이메일로 발송하며, 중복 확인은 확정 시점에 한다."
          enum:
          - signup
          - password_reset
          - email_change
          example: signup
          minLength: 1
          pattern: signup|password_reset|email_change
      required:
      - email
      - purpose
    EmailVerificationResponse:
      type: object
      properties:
        expires_in:
          type: integer
          format: int64
          description: 인증번호 유효 시간(초)
          example: 300
        retry_after:
          type: integer
          format: int64
          description: 재발송이 가능해지기까지 남은 시간(초). 429의 Retry-After 헤더와는 다른 값이다.
          example: 60
        verification_id:
          type: string
          description: 발급된 인증 요청 ID. confirm 호출 시 경로에 넣는다.
          example: ev_3f1c8a6b52d7411e9c04ab5d2e7f6081
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: 분기 기준으로 쓰는 값. message가 아니라 이 값으로 분기한다.
          example: INVALID_REQUEST
        details:
          type: array
          description: 검증 실패(400 INVALID_REQUEST)일 때만 존재한다. 값이 없으면 키 자체가 빠지므로 null 체크가 아니라 존재 여부로 확인한다.
          items:
            $ref: "#/components/schemas/FieldError"
        message:
          type: string
          description: 사용자에게 그대로 보여도 되는 한국어 문구
          example: 요청 형식이 올바르지 않습니다.
    ErrorResponse:
      type: object
      description: 컨트롤러까지 도달한 요청이 실패했을 때 모든 API가 공유하는 에러 응답 형식. 인증 필터가 막는 401은 HttpStatusEntryPoint가 상태 코드만 내보내므로 이 본문이 없다.
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
          description: 에러 상세
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: 문제가 된 요청 필드명
          example: email
        reason:
          type: string
          description: 그 필드의 위반 사유
          example: email은 필수입니다.
    InvitationAcceptResponse:
      type: object
      properties:
        role:
          type: string
          description: 부여된 역할
          enum:
          - OWNER
          - MEMBER
          example: MEMBER
        workspace_id:
          type: string
          description: 합류한 워크스페이스 ID
          example: ws_9d47a0e9a6324341b47562553b75f92a
        workspace_name:
          type: string
          description: 합류한 워크스페이스 이름
          example: 팀 워크스페이스
    InvitationPreviewResponse:
      type: object
      properties:
        email:
          type: string
          description: 초대받은 이메일 주소. 이 주소의 계정으로 로그인해야 수락할 수 있다.
          example: member@example.com
        expires_at:
          type: string
          format: date-time
          description: 초대 만료 시각(ISO-8601 UTC)
          example: 2026-09-14T04:25:24.371948Z
        invited_by:
          type: string
          description: 초대한 사람의 표시 이름
          example: 홍길동
        role:
          type: string
          description: 수락 시 부여될 역할
          enum:
          - OWNER
          - MEMBER
          example: MEMBER
        workspace_id:
          type: string
          description: 초대된 워크스페이스 ID
          example: ws_9d47a0e9a6324341b47562553b75f92a
        workspace_name:
          type: string
          description: 초대된 워크스페이스 이름
          example: 팀 워크스페이스
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          default: user@example.com
          description: 가입한 이메일
          example: user@example.com
          minLength: 1
        password:
          type: string
          default: password1234
          description: 비밀번호. 계정 없음·비밀번호 불일치·OAuth 전용 계정이 모두 같은 401로 응답된다.
          example: password1234
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "API 호출에 쓰는 JWT. Authorization: Bearer <access_token>으로 보낸다. payload의 sub(사용자 ID)·email·exp(만료 Unix seconds)를 갱신 타이밍 계산에 쓸 수 있다."
        expires_in:
          type: integer
          format: int64
          description: access_token 유효 시간(초)
          example: 900
        token_type:
          type: string
          description: 인증 스킴. 항상 Bearer다.
          example: Bearer
    MeResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: 가입 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
        display_name:
          type: string
          description: 화면에 보여줄 이름
          example: 표시 이름
        email:
          type: string
          description: 가입 이메일
          example: user@example.com
        id:
          type: string
          description: 사용자 ID
          example: user_3f1c8a6b52d7411e9c04ab5d2e7f6081
    OAuthExchangeRequest:
      type: object
      properties:
        code:
          type: string
          description: OAuth 로그인 성공 후 redirect로 받은 1회용 교환 코드(TTL 60초)
          minLength: 1
      required:
      - code
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          description: 현재 비밀번호
          example: password1234
          minLength: 1
        new_password:
          type: string
          description: 새 비밀번호(8~72자). 성공하면 현재 세션을 제외한 refresh token이 폐기된다.
          example: newPassword1234
          maxLength: 72
          minLength: 8
      required:
      - current_password
      - new_password
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 비밀번호를 재설정할 계정 이메일
          example: user@example.com
          minLength: 1
        new_password:
          type: string
          description: 새 비밀번호(8~72자). 성공하면 해당 사용자의 refresh token이 전부 폐기된다.
          example: password1234
          maxLength: 72
          minLength: 8
        verification_token:
          type: string
          description: purpose=password_reset로 받은 1회용 토큰
          example: EXAMPLE-verification-token-not-real-0000000
          minLength: 1
      required:
      - email
      - new_password
      - verification_token
    SignupRequest:
      type: object
      properties:
        display_name:
          type: string
          description: 표시명(50자 이하). 생략하면 이메일의 @ 앞부분이 표시명이 된다.
          example: 표시 이름
          maxLength: 50
          minLength: 0
        email:
          type: string
          format: email
          description: 가입할 이메일. 이미 가입된 이메일이면 토큰 유효성과 무관하게 409 DUPLICATE_EMAIL이 먼저 나온다.
          example: user@example.com
          minLength: 1
        password:
          type: string
          description: 비밀번호(8~72자)
          example: password1234
          maxLength: 72
          minLength: 8
        verification_token:
          type: string
          description: 인증번호 검증으로 받은 1회용 토큰
          example: EXAMPLE-verification-token-not-real-0000000
          minLength: 1
      required:
      - email
      - password
      - verification_token
    SignupResponse:
      type: object
      description: 가입 결과. 토큰은 담기지 않으므로 로그인 상태로 만들려면 POST /api/auth/login을 이어서 호출한다.
      properties:
        created_at:
          type: string
          format: date-time
          description: 가입 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
        display_name:
          type: string
          description: 화면에 보여줄 이름
          example: 표시 이름
        email:
          type: string
          description: 가입 이메일
          example: user@example.com
        id:
          type: string
          description: 생성된 사용자 ID
          example: user_3f1c8a6b52d7411e9c04ab5d2e7f6081
    VerificationConfirmRequest:
      type: object
      properties:
        code:
          type: string
          description: 메일로 받은 인증번호. 오입력 5회에서 잠기며 잔여 횟수는 응답에 담기지 않는다.
          example: '042173'
          minLength: 1
      required:
      - code
    VerificationConfirmResponse:
      type: object
      properties:
        expires_in:
          type: integer
          format: int64
          description: verification_token 유효 시간(초)
          example: 600
        verification_token:
          type: string
          description: 1회용 토큰. signup 또는 password-reset 요청에 그대로 실어 보낸다.
          example: EXAMPLE-verification-token-not-real-0000000
    WorkspaceAiModelRequest:
      type: object
      description: 워크스페이스 AI 모델 설정 변경 요청. OWNER만 호출할 수 있다.
      properties:
        ingest_lint:
          $ref: "#/components/schemas/AiModelSelectionRequest"
          description: ingest·lint 작업에 쓸 provider/model 조합
      required:
      - ingest_lint
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: 워크스페이스 이름(255자 이하)
          example: 내 워크스페이스
          maxLength: 255
          minLength: 0
      required:
      - name
    WorkspaceIconUpdateRequest:
      type: object
      properties:
        icon_emoji:
          type: string
          description: 아이콘으로 쓸 이모지. null을 주면 아이콘을 지운다.
          example: 📁
          maxLength: 32
          minLength: 0
          pattern: \S+
    WorkspaceInvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: 초대할 이메일 주소
          example: member@example.com
          maxLength: 255
          minLength: 0
        role:
          type: string
          description: 수락 시 부여할 역할
          enum:
          - OWNER
          - MEMBER
          example: MEMBER
      required:
      - email
      - role
    WorkspaceInvitationListResponse:
      type: object
      properties:
        invitations:
          type: array
          description: 아직 수락되지 않은 초대 목록. 생성 시각 오름차순.
          items:
            $ref: "#/components/schemas/WorkspaceInvitationResponse"
    WorkspaceInvitationResponse:
      type: object
      properties:
        email:
          type: string
          description: 초대한 이메일 주소
          example: member@example.com
        expires_at:
          type: string
          format: date-time
          description: 초대 만료 시각(ISO-8601 UTC)
          example: 2026-09-14T04:25:24.371948Z
        invitation_id:
          type: string
          description: 초대 ID
          example: inv_3c1d8e2f4a5b4c6d8e9f0a1b2c3d4e5f
        invited_at:
          type: string
          format: date-time
          description: 초대 생성 시각(ISO-8601 UTC)
          example: 2026-09-07T04:25:24.371948Z
        role:
          type: string
          description: 수락 시 부여할 역할
          enum:
          - OWNER
          - MEMBER
          example: MEMBER
    WorkspaceLifecycleResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: 삭제(휴지통) 상태인지 여부. 복구하면 false가 된다.
          example: true
        deleted_at:
          type: string
          format: date-time
          description: 삭제된 시각(ISO-8601 UTC). 복구된 경우 null이다.
          example: 2026-08-13T04:25:24.371948Z
        id:
          type: string
          description: 대상 워크스페이스 ID
          example: ws_9d47a0e9a6324341b47562553b75f92a
    WorkspaceListResponse:
      type: object
      properties:
        workspaces:
          type: array
          description: 내가 활성 멤버인 워크스페이스 목록
          items:
            $ref: "#/components/schemas/WorkspaceResponse"
    WorkspaceMemberListResponse:
      type: object
      properties:
        members:
          type: array
          description: 워크스페이스의 활성 멤버 목록. 합류 시각 오름차순.
          items:
            $ref: "#/components/schemas/WorkspaceMemberResponse"
    WorkspaceMemberResponse:
      type: object
      properties:
        display_name:
          type: string
          description: 멤버 표시 이름
          example: 홍길동
        email:
          type: string
          description: 멤버 이메일
          example: member@example.com
        joined_at:
          type: string
          format: date-time
          description: 합류 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
        provider:
          type: string
          description: "계정을 만든 수단. 일반 가입은 local, OAuth는 provider 등록 ID. 같은 이메일이라도 provider가 다르면 다른 계정이다."
          example: local
        role:
          type: string
          description: 워크스페이스 역할
          enum:
          - OWNER
          - MEMBER
          example: MEMBER
        user_id:
          type: string
          description: 멤버 사용자 ID
          example: user_1f9a74af
    WorkspaceMemberRoleUpdateRequest:
      type: object
      properties:
        role:
          type: string
          description: 새 역할
          enum:
          - OWNER
          - MEMBER
          example: OWNER
      required:
      - role
    WorkspaceRenameRequest:
      type: object
      properties:
        name:
          type: string
          description: 새 워크스페이스 이름(255자 이하)
          example: 이름 바꾼 워크스페이스
          maxLength: 255
          minLength: 0
      required:
      - name
    WorkspaceResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: 생성 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
        icon_emoji:
          type: string
          description: 아이콘 이모지. 설정하지 않았으면 null이다.
          example: 📁
        icon_url:
          type: string
          description: 아이콘 이미지 조회 경로. 이미지를 설정하지 않았으면 null이다.
          example: /api/workspaces/ws_9d47a0e9a6324341b47562553b75f92a/icon/image
        id:
          type: string
          description: 워크스페이스 ID. 이후 대부분의 API 경로에 들어간다.
          example: ws_9d47a0e9a6324341b47562553b75f92a
        name:
          type: string
          description: 워크스페이스 이름
          example: 내 워크스페이스
        updated_at:
          type: string
          format: date-time
          description: 마지막 변경 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
    WorkspaceTrashItem:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          description: 삭제된 시각(ISO-8601 UTC)
          example: 2026-08-13T04:25:24.371948Z
        deleted_by:
          type: string
          description: 삭제한 사용자 ID
          example: user_3f1c8a6b52d7411e9c04ab5d2e7f6081
        id:
          type: string
          description: 워크스페이스 ID
          example: ws_9d47a0e9a6324341b47562553b75f92a
        name:
          type: string
          description: 워크스페이스 이름
          example: 내 워크스페이스
    WorkspaceTrashResponse:
      type: object
      properties:
        workspaces:
          type: array
          description: 삭제되어 휴지통에 있는 워크스페이스 목록
          items:
            $ref: "#/components/schemas/WorkspaceTrashItem"
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      name: bearerAuth
      scheme: bearer
      type: http
