spring.application.name=access-svc

# 운영 기본 로그는 경계와 상태 변화(INFO)만 출력한다. 내부 처리 단계는 local에서 DEBUG로 연다.
logging.level.fruition=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [requestId=%X{requestId:--} userId=%X{userId:--} flowId=%X{flowId:--}] %logger{36} - %msg%n

# access 앱 포트. document(8080)와 나란히 띄운다.
server.port=8081
# Next.js/ALB가 전달한 client address를 servlet remote address로 복원해 IP rate limit에 사용한다.
server.forward-headers-strategy=framework

# Actuator — 관리 엔드포인트를 업무 포트에서 분리한다.
# ALB Ingress(k8s/overlays/aws/ingress.yaml)가 업무 포트만 라우팅하므로,
# 분리해두면 /actuator/prometheus가 인터넷에 노출되지 않는다.
# k8s에서는 configmap의 MANAGEMENT_PORT가 두 서비스를 같은 번호로 덮는다
# (ALB healthcheck-port 주석이 Ingress 단위라 서비스별로 다른 번호를 줄 수 없다).
management.server.port=${MANAGEMENT_PORT:8083}
management.endpoints.web.exposure.include=health,prometheus
# HTTP 응답 시간 백분위(p95 등)를 쓰려면 히스토그램 버킷이 필요하다.
# 관측 범위는 기본값(1ms~30s)을 쓴다. 로컬 응답이 1ms대라 하한을 올리면 p95가
# 첫 버킷 보간값으로 뭉개지고, 동기 외부 호출은 10초를 넘길 수 있어 상한도 못 좁힌다.
# 대신 endpoint 조합 하나당 시계열이 69개 늘어난다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# 모든 지표에 붙는 공통 태그. Spring Boot는 application 태그를 자동으로 붙이지 않는데,
# Grafana JVM 대시보드(4701)를 비롯한 표준 대시보드가 이 라벨로 서비스를 구분한다.
management.metrics.tags.application=${spring.application.name}

# DataSource — access 전용 DB(access_db). 런타임은 DML만 가능한 runtime 계정을 쓴다.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${ACCESS_DB_NAME:access_db}
spring.datasource.username=${ACCESS_DB_RUNTIME_USER:access_runtime}
spring.datasource.password=${ACCESS_DB_RUNTIME_PASSWORD:access_runtime_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Session
spring.session.store-type=jdbc
# 세션 테이블은 V2 migration이 생성 — runtime 계정은 DDL 권한이 없다
spring.session.jdbc.initialize-schema=never

# JPA
# access_db 스키마는 이 앱의 Flyway가 단일 소스로 관리한다. 앱은 검증만 수행(validate).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway — access_db migration은 access-svc가 소유한다 (classpath:db/migration).
# DDL은 스키마 소유 계정(migration)으로만 실행한다. runtime 계정은 DML 전용.
spring.flyway.enabled=true
spring.flyway.user=${ACCESS_DB_MIGRATION_USER:access_migration}
spring.flyway.password=${ACCESS_DB_MIGRATION_PASSWORD:access_migration_dev_password}

# llmPipeline·서비스 간 내부 호출용 토큰. 사용자 인증과 분리한다.
app.internal.callback-token=${INTERNAL_CALLBACK_TOKEN}
# 워크스페이스 생성 직후 초기 노트를 요청할 document(문서 서비스) 내부 API 기본 주소.
app.internal.document-base-url=${DOCUMENT_INTERNAL_BASE_URL:http://localhost:8080}
app.ai.enabled-providers=openai,gemini,claude

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-please-32bytes-min}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
app.jwt.issuer=${JWT_ISSUER:fruition-access}
app.jwt.audience=${JWT_AUDIENCE:fruition-api}
# refresh token은 JavaScript에서 읽을 수 없는 쿠키로만 전달한다.
app.auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}

# Redis (다중 인스턴스 공유 store: OAuth 교환 코드)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Lettuce 기본 60s는 Redis 장애 시 요청이 1분씩 매달리므로 짧게 fail-fast 한다.
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}

# 공개 이메일 중복 확인 API의 계정 열거 방지용 fixed-window 제한.
app.auth.email-availability.window-seconds=${AUTH_EMAIL_AVAILABILITY_WINDOW_SECONDS:60}
app.auth.email-availability.ip-limit=${AUTH_EMAIL_AVAILABILITY_IP_LIMIT:30}
app.auth.email-availability.email-limit=${AUTH_EMAIL_AVAILABILITY_EMAIL_LIMIT:5}

# Email Verification (회원가입/비밀번호 재설정 인증번호)
# dev-fixed-code: 로컬 개발용 고정 인증번호(예: 9700). 빈값이면 랜덤 6자리 발급. 운영에서는 반드시 빈값 유지.
app.auth.email-verification.code-ttl-seconds=${AUTH_EMAIL_CODE_TTL_SECONDS:300}
app.auth.email-verification.token-ttl-seconds=${AUTH_EMAIL_TOKEN_TTL_SECONDS:600}
app.auth.email-verification.resend-cooldown-seconds=${AUTH_EMAIL_RESEND_COOLDOWN_SECONDS:60}
app.auth.email-verification.daily-limit=${AUTH_EMAIL_DAILY_LIMIT:5}
app.auth.email-verification.max-attempts=${AUTH_EMAIL_MAX_ATTEMPTS:5}
app.auth.email-verification.dev-fixed-code=${AUTH_EMAIL_DEV_FIXED_CODE:}
# 발신 주소. SMTP 발송 시 필수. spring.mail.*는 커밋하지 않고 배포 환경에서 SPRING_MAIL_* 로 주입한다.
# spring.mail.host가 설정되면 SMTP 발송, 없으면 dev 로그 stub로 동작한다(EmailSenderConfig).
app.auth.email-verification.from=${MAIL_FROM:}
# SMTP timeout(ms). 응답 없는 메일 서버에 무한 대기하지 않도록 항상 적용한다(host 미설정 시 무효).
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}

# OAuth2 Client - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# OAuth2 Client - Naver (Spring 기본 미제공, provider 직접 등록)
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:dev-placeholder-client-id}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:dev-placeholder-client-secret}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# OAuth2 Client - Kakao (Spring 기본 미제공, provider 직접 등록)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:dev-placeholder-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:dev-placeholder-client-secret}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# OAuth2 로그인 성공/실패 후 프론트엔드로 redirect할 base URL
app.oauth.frontend-redirect-uri=${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}

# 프론트엔드가 /api/** 를 fetch/XHR로 호출할 수 있도록 허용할 origin (콤마로 구분)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger / SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
# 명세를 파일로 커밋하므로 키 순서를 고정한다 — 순서가 흔들리면 diff가 계약 변경을 못 드러낸다.
springdoc.writer-with-order-by-keys=true
