name: Tests

on:
  pull_request:
    paths:
      - 'services/access-svc/**'
      - 'services/document-svc/**'
      - 'services/java-shared/**'
      - 'frontend/**'
      - 'services/ai-svc/pipeline/**'
      - '.github/workflows/tests.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'services/access-svc/**'
      - 'services/document-svc/**'
      - 'services/java-shared/**'
      - 'frontend/**'
      - 'services/ai-svc/pipeline/**'
      - '.github/workflows/tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 통합 테스트가 Testcontainers로 PostgreSQL·MongoDB를 띄운다. ubuntu 러너의 Docker를 그대로 쓴다.
      - name: Run tests
        run: ./gradlew :java-shared:test :access-svc:test :document-svc:test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            services/access-svc/build/reports/tests/test
            services/document-svc/build/reports/tests/test
            services/java-shared/build/reports/tests/test

  frontend:
    name: Frontend (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run markdown tests
        run: npm run test:markdown

      - name: Run user preference tests
        run: npm run test:user-preferences

  pipeline:
    name: llmPipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ai-svc/pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-svc/pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      # document_restoration은 PyMuPDF 등 무거운 의존성이 필요해 별도 requirements를 쓴다.
      # 기본 실행에서는 제외하고, 필요해지면 requirements-document-restoration.txt를 설치해 붙인다.
      - name: Run tests
        run: pytest -q --ignore=tests/modules/document_restoration
