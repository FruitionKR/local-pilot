# Environment의 required reviewers와 배포 branch 제한은 GitHub 관리자가 별도로 설정한다.
name: Deploy (EKS)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy 또는 동일 schema의 성공 SHA 재배포"
        type: choice
        options: [deploy, rollback]
        default: deploy
      rollback_sha:
        description: "rollback일 때 기존 성공 release의 40자리 SHA"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-eks-feedback
  cancel-in-progress: false

jobs:
  deploy:
    environment: feedback
    # 고정 egress 또는 VPC 안에서 운영하는 전용 runner. PR 검증 runner와 분리한다.
    runs-on: [self-hosted, linux, x64, fruition-feedback]
    timeout-minutes: 90
    env:
      AWS_REGION: ap-northeast-2
      EKS_CLUSTER: fruition-eks
      DEPLOY_CONFIG: ${{ vars.AWS_DEPLOY_CONFIG_JSON }}
      ACTION: ${{ inputs.action }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependency
        run: pip install PyYAML==6.0.2
      - name: Validate and render before AWS mutation
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          if [ "$ACTION" = rollback ]; then SHA="$ROLLBACK_SHA"; fi
          printf '%s' "$DEPLOY_CONFIG" > "$RUNNER_TEMP/deploy-config.json"
          python scripts/aws_deploy.py render --config "$RUNNER_TEMP/deploy-config.json" --sha "$SHA" > "$RUNNER_TEMP/rendered.yaml"
          echo "IMAGE_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target account
        run: |
          set -euo pipefail
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          EXPECTED=$(python -c 'import json,os; print(json.loads(os.environ["DEPLOY_CONFIG"])["account_id"])')
          test "$ACTUAL" = "$EXPECTED"
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build missing immutable images or reuse existing SHA
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          for service in document-svc access-svc pipeline converter; do
            REPO="fruition-$service"
            # listing 자체가 실패하면 image 부재로 처리하지 않고 중단한다.
            EXISTING=$(aws ecr list-images --repository-name "$REPO" --filter tagStatus=TAGGED --query 'imageIds[].imageTag' --output json)
            if IMAGE_TAGS="$EXISTING" python -c 'import json,os,sys; sys.exit(0 if os.environ["IMAGE_SHA"] in json.loads(os.environ["IMAGE_TAGS"]) else 1)'; then
              continue
            fi
            if [ "$ACTION" = rollback ]; then echo "기존 rollback image 없음: $REPO"; exit 1; fi
            case "$service" in
              document-svc|access-svc) docker build -t "$REGISTRY/$REPO:$IMAGE_SHA" -f "services/backend/$service/Dockerfile" services/backend ;;
              pipeline) docker build -t "$REGISTRY/$REPO:$IMAGE_SHA" services/ai/pipeline ;;
              converter) docker build -t "$REGISTRY/$REPO:$IMAGE_SHA" -f services/ai/converter/Dockerfile services/ai ;;
            esac
            docker push "$REGISTRY/$REPO:$IMAGE_SHA"
          done
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Deploy with DB, migration, rollout and smoke gates
        run: python scripts/aws_deploy.py "$ACTION" --config "$RUNNER_TEMP/deploy-config.json" --sha "$IMAGE_SHA"
