spring.application.name=backend

# DataSource
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fruition_mvp}
spring.datasource.username=${POSTGRES_USER:fruition}
spring.datasource.password=${POSTGRES_PASSWORD:fruition_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Session
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# MinIO
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.access-key=${S3_ACCESS_KEY:fruition}
app.storage.secret-key=${S3_SECRET_KEY:fruition_dev_secret}
app.storage.bucket=${S3_BUCKET:fruition-storage}

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Processing (FastAPI)
app.processing.endpoint=${PROCESSING_ENDPOINT:http://localhost:8001/process}

# Swagger / SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
