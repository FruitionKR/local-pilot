# 상태 계층을 관리형 서비스로 교체하는 env 패치.
# REPLACE_ME_* 는 terraform output(rds_endpoint·redis_endpoint·s3_bucket)과 도메인 결정값으로 치환.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fruition-config
  namespace: fruition
data:
  # POSTGRES_HOST는 서비스별 RDS가 달라 configmap이 아니라 각 deployment env로 주입
  # (kustomization.yaml의 access-svc/document-svc patch 참조)
  REDIS_HOST: "REPLACE_ME_REDIS_ENDPOINT"
  S3_ENDPOINT: "https://s3.ap-northeast-2.amazonaws.com"
  S3_BUCKET: "REPLACE_ME_S3_BUCKET"
  # Vercel production 도메인만 허용 (§7)
  CORS_ALLOWED_ORIGINS: "https://REPLACE_ME_APP_DOMAIN"
  OAUTH_FRONTEND_REDIRECT_URI: "https://REPLACE_ME_APP_DOMAIN/oauth/callback"
