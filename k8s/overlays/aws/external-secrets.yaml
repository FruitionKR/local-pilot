# Secrets Manager fruition/app → k8s Secret fruition-secret 동기화.
# ExternalSecrets Operator(helm, external-secrets namespace)가 IRSA로 읽는다
# (role: terraform output irsa_role_arns.external_secrets — operator SA annotation에 연결).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fruition-secret
  namespace: fruition
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: fruition-secret # base secret.yaml과 같은 이름 — 앱 manifest 수정 불필요
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fruition/app
