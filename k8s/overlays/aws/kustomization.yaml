# AWS(EKS) overlay — docs/Fruition_AWS_MSA_Architecture.md §8 소규모 profile.
# 상태 계층은 RDS·ElastiCache·S3(Terraform: infra/terraform), Kafka는 base의 Strimzi 그대로.
# REPLACE_ME_* 값은 README.md 절차대로 terraform output으로 치환한 뒤 apply한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - external-secrets.yaml

# CI가 kustomize edit set image로 태그를 커밋 SHA로 덮어쓴다.
images:
  - name: fruition-document-svc
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-document-svc
    newTag: latest
  - name: fruition-access-svc
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-access-svc
    newTag: latest
  # pipeline-api·ingest-worker는 같은 이미지(fruition-pipeline)
  - name: fruition-mvp-dev-pipeline-api
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-pipeline
    newTag: latest
  - name: fruition-mvp-dev-ingest-worker
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-pipeline
    newTag: latest
  - name: fruition-converter
    newName: REPLACE_ME_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/fruition-converter
    newTag: latest

patches:
  # 관리형 서비스 endpoint 주입
  - path: configmap-aws.yaml

  # NodePort(kind 전용) → ClusterIP. ALB Ingress가 대신 노출한다.
  - target:
      kind: Service
      name: document-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      kind: Service
      name: access-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort

  # imagePullPolicy Never(kind 전용) → IfNotPresent + §8.2 resource 상향
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: document-svc
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: document-svc
                imagePullPolicy: IfNotPresent
                env:
                  - name: POSTGRES_HOST
                    value: "REPLACE_ME_CORE_RDS_ENDPOINT"
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    memory: 2Gi
  # POSTGRES_HOST: RDS가 access/core 2대로 나뉘어 deployment별 env로 주입 (envFrom보다 우선)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: access-svc
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: access-svc
                imagePullPolicy: IfNotPresent
                env:
                  - name: POSTGRES_HOST
                    value: "REPLACE_ME_ACCESS_RDS_ENDPOINT"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pipeline-api
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: pipeline-api
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    memory: 2Gi
  # pipeline-runs PVC(RWO, EBS)를 pipeline-api와 공유하므로 같은 노드에 강제 배치.
  # S3 기반 아티팩트 저장으로 이전하면 이 affinity와 함께 AI Worker 노드 분리를 진행한다.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingest-worker
        namespace: fruition
      spec:
        template:
          spec:
            affinity:
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: pipeline-api
                    topologyKey: kubernetes.io/hostname
            containers:
              - name: ingest-worker
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                  limits:
                    memory: 4Gi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: converter
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: converter
                imagePullPolicy: IfNotPresent
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edit-event-consumer
        namespace: fruition
      spec:
        template:
          spec:
            containers:
              - name: edit-event-consumer
                imagePullPolicy: IfNotPresent
