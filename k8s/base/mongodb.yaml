# 문서 편집 상태 원본 (dev compose의 mongodb 서비스와 동일 구성).
# 트랜잭션 사용을 위해 single-node replica set(rs0)으로 기동한다.
# kustomization.yaml에는 포함하지 않는다(상태 계층 base 제외 원칙) — README 절차대로 개별 apply.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: fruition
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: fruition
  labels:
    app: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC(RWO) 단일 인스턴스
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            # dev compose healthcheck와 동일 — 미초기화 상태면 rs.initiate 수행 후 정상 판정
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate().ok }' | grep -q 1"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: fruition
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
