apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-task-worker
  namespace: fruition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-task-worker
  template:
    metadata:
      labels:
        app: query-task-worker
    spec:
      containers:
        - name: query-task-worker
          image: fruition-mvp-dev-pipeline-api:latest
          imagePullPolicy: Never
          command: ["python", "-m", "app.workers.task_worker"]
          envFrom:
            - configMapRef: {name: fruition-config}
            - secretRef: {name: fruition-secret}
          env:
            - {name: AI_COMMAND_TOPIC, value: ai.query.command}
            - {name: AI_COMMAND_CONSUMER_GROUP, value: query-task-worker}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
---
