# pipeline 런 아티팩트 공유 볼륨 (compose의 pipeline-runs named volume 대응).
# 단일 노드 kind에서는 RWO PVC를 pipeline-api·ingest-worker가 함께 마운트할 수 있다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-runs
  namespace: fruition
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-api
  namespace: fruition
  labels:
    app: pipeline-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-api
  template:
    metadata:
      labels:
        app: pipeline-api
    spec:
      containers:
        - name: pipeline-api
          image: fruition-mvp-dev-pipeline-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fruition-config
            - secretRef:
                name: fruition-secret
          volumeMounts:
            - name: runs
              mountPath: /app/runs
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: pipeline-runs
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-api
  namespace: fruition
spec:
  type: ClusterIP
  selector:
    app: pipeline-api
  ports:
    - port: 8000
      targetPort: 8000
