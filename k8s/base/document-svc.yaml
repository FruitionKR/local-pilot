apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-svc
  namespace: fruition
  labels:
    app: document-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-svc
  template:
    metadata:
      labels:
        app: document-svc
    spec:
      containers:
        - name: document-svc
          # 로컬 빌드 이미지 (kind load docker-image로 주입)
          image: fruition-document-svc:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fruition-config
            - secretRef:
                name: fruition-secret
          # Flyway migration 포함 기동 대기 (migration은 document-svc가 소유)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: document-svc
  namespace: fruition
spec:
  # 클러스터 내부에서는 http://document-svc:8080, 호스트에서는 http://localhost:30080
  type: NodePort
  selector:
    app: document-svc
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
