name: fruition-local-tools

services:
  markitdown:
    build:
      context: ./converter
    container_name: fruition-markitdown
    environment:
      MAX_UPLOAD_MB: 50
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
